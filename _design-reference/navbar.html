<style>

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

.bb-nav-root {

.bb-nav {

  height: 72px;

}

.bb-nav-logo {
  display: flex;

}

.bb-nav-logo img {

  max-width: 120px;
  object-fit: contain;
  mix-blend-mode: multiply;
  display: block;
  flex-shrink: 0;
}

.bb-nav-links {
  display: flex;
  gap: 2px;
  list-style: none;
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
}

.bb-nav-links a {
  text-decoration: none;
  color: #222;
  font-weight: 700;
  font-size: 14px;
  padding: 7px 14px;
  border-radius: 22px;
  transition: all 0.18s;
  display: block;
}

.bb-nav-links a:hover,
.bb-nav-links a.active {
  color: #E91E8C;
  background: rgba(233,30,140,0.06);
}

.bb-nav-right {
  display: flex;
  align-items: center;
  gap: 8px;

}

.bb-wpp-pill {
  display: inline-flex;

  gap: 6px;

  color: #fff;
  font-size: 13px;
  font-weight: 800;
  padding: 8px 16px;
  border-radius: 22px;
  text-decoration: none;
  transition: all 0.2s;
  white-space: nowrap;
  font-family: 'Nunito', sans-serif;
}
.bb-wpp-pill:hover { transform: translateY(-1px); }

.bb-nav-cta {

  box-shadow: 0 4px 14px rgba(233,30,140,0.30);
  font-family: 'Nunito', sans-serif;
}
.bb-nav-cta:hover {
  background: #7DC720;
  transform: translateY(-1px);
}

.bb-hamburger {
  display: none;
  flex-direction: column;
  gap: 5px;
  cursor: pointer;
  padding: 6px;
  background: none;
  border: none;
}
.bb-hamburger span {
  width: 22px; height: 2px;
  background: #3D1A6E;
  border-radius: 2px;
  display: block;
}

.bb-mobile-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(61,26,110,0.40);
  z-index: 9998;
}
.bb-mobile-overlay.open { display: block; }

.bb-mobile-menu {
  position: fixed;
  top: 0; right: -100%;
  width: min(300px, 88vw);
  height: 100vh;
  background: #fff;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  box-shadow: -4px 0 28px rgba(0,0,0,0.14);
  transition: right 0.28s cubic-bezier(.4,0,.2,1);
  font-family: 'Nunito', sans-serif;
}
.bb-mobile-menu.open { right: 0; }

.bb-mobile-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid rgba(0,0,0,0.07);
}
.bb-mobile-header img { height: 44px; mix-blend-mode: multiply; }

.bb-mobile-close {
  width: 34px; height: 34px;
  border: none;
  background: #F5F5F5;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  font-size: 17px;
  color: #555;
  transition: all 0.18s;
}
.bb-mobile-close:hover { background: #E91E8C; color: #fff; }

.bb-mobile-links { padding: 16px 0; flex: 1; }
.bb-mobile-links a {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 24px;
  color: #222;
  font-weight: 700;
  font-size: 15px;
  text-decoration: none;
  transition: all 0.15s;
}
.bb-mobile-links a:hover {
  color: #E91E8C;
  background: rgba(233,30,140,0.05);
  padding-left: 30px;
}

.bb-mobile-footer {
  padding: 18px 22px;
  border-top: 1px solid rgba(0,0,0,0.07);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.bb-mobile-footer .bb-nav-cta,
.bb-mobile-footer .bb-wpp-pill { justify-content: center; }

@media (max-width: 900px) {
  .bb-nav-links, .bb-wpp-pill { display: none; }
  .bb-hamburger { display: flex; }
  .bb-nav { padding: 0 20px; height: 64px; }
  .bb-nav-logo img { height: 44px; max-width: 100px; }
  .bb-nav-logo { height: 64px; }
}

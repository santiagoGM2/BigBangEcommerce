<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

.bb-map-root {
  font-family: 'Nunito', sans-serif;
  position: relative;
  left: 50%;
  transform: translateX(-50%);
  width: 100vw;
  max-width: 100vw;
  overflow: hidden;
  background: #fff;
  padding: 72px 48px;
}

.bb-map-inner { max-width: 1100px; margin: 0 auto; }

.bb-map-header { text-align: center; margin-bottom: 44px; }

.bb-map-label {
  display: inline-block;
  background: rgba(61,26,110,0.08);
  color: #3D1A6E;
  font-size: 11px; font-weight: 900;
  padding: 5px 14px; border-radius: 20px;
  text-transform: uppercase; letter-spacing: 0.10em;
  margin-bottom: 14px;
}

.bb-map-title {
  font-size: clamp(24px, 2.8vw, 36px);
  font-weight: 900; color: #1a1a2e;
  line-height: 1.15; margin-bottom: 10px;
}
.bb-map-title span { color: #E91E8C; }

.bb-map-sub { font-size: 14px; color: #999; font-weight: 600; }

.bb-map-layout {
  display: grid;
  grid-template-columns: 1fr 340px;
  gap: 32px;
  align-items: start;
}

.bb-map-frame {
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 8px 30px rgba(0,0,0,0.12);
  height: 420px;
  position: relative;
}
.bb-map-frame iframe { width: 100%; height: 100%; border: none; display: block; }

.bb-map-panel { display: flex; flex-direction: column; gap: 16px; }

.bb-map-card {
  background: #F7F7F7;
  border-radius: 14px;
  padding: 20px;
  border: 1.5px solid rgba(61,26,110,0.07);
}

.bb-map-card-title {
  font-size: 14px; font-weight: 900; color: #1a1a2e;
  margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}

.bb-map-input-row { display: flex; gap: 8px; }

.bb-map-input {
  flex: 1;
  padding: 10px 14px;
  border-radius: 8px;
  border: 1.5px solid rgba(0,0,0,0.12);
  font-family: 'Nunito', sans-serif;
  font-size: 13px; font-weight: 600; color: #222;
  outline: none;
  transition: border-color 0.18s;
}
.bb-map-input:focus { border-color: #E91E8C; }

.bb-map-input-btn {
  padding: 10px 16px;
  background: #E91E8C; color: #fff;
  border: none; border-radius: 8px;
  font-family: 'Nunito', sans-serif;
  font-size: 13px; font-weight: 800;
  cursor: pointer; transition: all 0.2s;
  white-space: nowrap;
}
.bb-map-input-btn:hover { background: #3D1A6E; }

.bb-map-info-item { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
.bb-map-info-item:last-child { margin-bottom: 0; }

.bb-map-info-icon {
  width: 32px; height: 32px;
  background: rgba(233,30,140,0.08);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

.bb-map-info-text strong { display: block; font-size: 13px; font-weight: 800; color: #222; }
.bb-map-info-text span { font-size: 12px; color: #999; font-weight: 600; }

.bb-map-directions-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  background: #3D1A6E; color: #fff;
  font-size: 14px; font-weight: 800;
  padding: 13px 20px; border-radius: 10px;
  text-decoration: none; transition: all 0.22s;
  box-shadow: 0 4px 14px rgba(61,26,110,0.25);
  font-family: 'Nunito', sans-serif;
}
.bb-map-directions-btn:hover { background: #E91E8C; transform: translateY(-1px); }

@media (max-width: 1024px) {
  .bb-map-layout { grid-template-columns: 1fr; }
  .bb-map-frame { height: 300px; }
}
@media (max-width: 900px) {
  .bb-map-root { padding: 52px 22px; }
}
@media (max-width: 480px) {
  .bb-map-root { padding: 44px 16px; }
}
</style>

<section class="bb-map-root" id="mapa">
  <div class="bb-map-inner">

    <div class="bb-map-header">
      <div class="bb-map-label">Encuéntranos</div>
      <h2 class="bb-map-title">Visítanos en <span>Cali</span></h2>
      <p class="bb-map-sub">Cl. 9 #30-44, La Alameda, Cali, Valle del Cauca</p>
    </div>

    <div class="bb-map-layout">

      <div class="bb-map-frame">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3982.6174186785994!2d-76.53555!3d3.44059!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8e30a65d74e8a7e7%3A0x1234567890abcdef!2sPi%C3%B1atas%20y%20Regalos%20Big%20Bang!5e0!3m2!1ses!2sco!4v1680000000000"
          allowfullscreen=""
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
          title="Mapa Big Bang Piñatas"
        ></iframe>
      </div>

      <div class="bb-map-panel">

        <div class="bb-map-card">
          <div class="bb-map-card-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#E91E8C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            ¿Cómo llegar?
          </div>
          <div class="bb-map-input-row">
            <input type="text" class="bb-map-input" id="bbOrigin" placeholder="Escribe tu dirección o barrio…" />
            <button class="bb-map-input-btn" onclick="bbGetDirections()">Ir</button>
          </div>
        </div>

        <div class="bb-map-card">
          <div class="bb-map-card-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#E91E8C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
            Nuestra ubicación
          </div>

          <div class="bb-map-info-item">
            <div class="bb-map-info-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#E91E8C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg></div>
            <div class="bb-map-info-text"><strong>Dirección</strong><span>Cl. 9 #30-44, La Alameda, Cali, Valle del Cauca</span></div>
          </div>

          <div class="bb-map-info-item">
            <div class="bb-map-info-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#E91E8C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
            <div class="bb-map-info-text"><strong>Horario</strong><span>Lun – Sáb: 8:00 am – 6:00 pm</span></div>
          </div>

          <div class="bb-map-info-item">
            <div class="bb-map-info-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#E91E8C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 014.73 12a19.79 19.79 0 01-3.07-8.67A2 2 0 013.64 1h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 8.91a16 16 0 005.61 5.61l.77-.77a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0121 16z"/></svg></div>
            <div class="bb-map-info-text"><strong>Teléfono</strong><span>+57 321 558 1600</span></div>
          </div>
        </div>

        <a href="https://www.google.com/maps/dir/?api=1&destination=Pi%C3%B1atas+y+Regalos+Big+Bang+Cali" target="_blank" class="bb-map-directions-btn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
          Abrir en Google Maps
        </a>

      </div>
    </div>
  </div>
</section>

<script>
function bbGetDirections() {
  var origin = document.getElementById('bbOrigin').value.trim();
  if (!origin) return;
  var dest = encodeURIComponent('Piñatas y Regalos Big Bang, Cali, Colombia');
  var orig = encodeURIComponent(origin + ', Cali, Colombia');
  window.open('https://www.google.com/maps/dir/?api=1&origin=' + orig + '&destination=' + dest, '_blank');
}
document.getElementById('bbOrigin') && document.getElementById('bbOrigin').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') bbGetDirections();
});
</script>

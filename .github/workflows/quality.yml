name: Calidad del repositorio

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.18.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Instalar dependencias fijadas
        run: |
          pnpm install --frozen-lockfile
          python -m pip install -r ops/catalog-proxy/requirements.txt
      - name: Revisar vulnerabilidades conocidas
        run: pnpm audit:dependencies
      - name: Revisar estilo y tipos
        run: |
          pnpm lint
          pnpm typecheck
      - name: Probar aplicacion, fotos y proxy
        run: |
          pnpm test
          pnpm test:fotos
          pnpm test:quality
          python -m unittest discover -s ops/catalog-proxy -p 'test_*.py' -v
      - name: Verificar esquema en base de datos desechable
        run: pnpm test:schema
      - name: Construir y verificar rutas con datos locales
        # No accede al ERP, Supabase ni secretos de produccion.
        run: pnpm build:verify
